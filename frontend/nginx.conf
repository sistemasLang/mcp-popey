# nginx for the `admin` compose service. Mirrors deploy/nginx/mcp-popey.conf
# (VPS) but proxies to the `mcp` container and serves the panel from the image.
server {
    listen 80;
    server_name _;

    location = /mcp {
        proxy_pass http://mcp:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP may answer with SSE: do not buffer.
        proxy_buffering off;
        proxy_cache off;
        # Above QUERY_SQL_TIMEOUT_MS (30 s by default).
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # RFC 9728: MCP clients discover Auth0 from here after a 401.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:3030;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://mcp:3030;
        proxy_set_header Host $host;
    }

    # Admin API (OAuth, admin audience). Small JSON bodies only.
    location ^~ /admin/api/ {
        proxy_pass http://mcp:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    # Admin panel (static files, real files only: no SPA catch-all).
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # The panel's only client-side route besides /admin/.
    location = /admin/forbidden {
        root /usr/share/nginx/html;
        try_files /admin/index.html =404;
    }
    location = /admin/config.json {
        root /usr/share/nginx/html;
        add_header Cache-Control no-store always;
    }

    location / {
        return 404;
    }
}
