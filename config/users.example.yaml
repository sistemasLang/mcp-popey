# EXAMPLE ONLY. Normally you do not edit this file: the admin panel (/admin/) writes
# data/users.yaml (USERS_FILE). Editing it by hand also works; changes apply on the
# next request, without a restart.
#
# The Auth0 token only proves WHO the caller is: (issuer, subject).
# WHAT they can do lives here:
#   role         must exist in config/circuit-access.yaml
#   databaseKey  must be one of DATABASE_KEYS in .env (the tenant database)
#   admin        may use the admin panel (people only)
#   enabled      false cuts access at once, even with a still-valid token
# Without role + databaseKey a user has no /mcp access (an admin may have none).
#
# subject: Auth0 user_id (auth0|...), or <client_id>@clients for an M2M app (n8n).
# issuer:  https://<AUTH0_DOMAIN>/ (with the trailing slash).

version: 2
users:
  - id: 5b0c2f1e-0000-4000-8000-000000000001
    kind: human
    label: jefe@empresa.com
    admin: true
    enabled: true
    identities:
      - issuer: https://empresa.us.auth0.com/
        subject: auth0|0123456789abcdef
    createdAt: "2026-11-01T00:00:00.000Z"

  - id: 5b0c2f1e-0000-4000-8000-000000000002
    kind: human
    label: juan@empresa.com
    admin: false
    enabled: true
    role: ventas
    databaseKey: lang
    identities:
      - issuer: https://empresa.us.auth0.com/
        subject: auth0|fedcba9876543210
    createdAt: "2026-11-01T00:00:00.000Z"

  - id: 5b0c2f1e-0000-4000-8000-000000000003
    kind: service
    label: n8n-reportes
    admin: false
    enabled: true
    role: administrador
    databaseKey: lang
    identities:
      - issuer: https://empresa.us.auth0.com/
        subject: AbCdEf0123456789@clients
    createdAt: "2026-11-01T00:00:00.000Z"
