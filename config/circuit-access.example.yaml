# EXAMPLE ONLY — not the real Popey permissions.
#
# roles.<role>.circuits  circuits the role sees in list_circuits / describe_circuit.
#
# Every role listed here can use query_sql: free read-only SQL over everything the
# database role mcp_popey_ro can read, regardless of its circuits. A role not listed
# here has no access at all. Restrictions on what is readable go in the grants of
# scripts/create_readonly_role.sql, not here.

roles:
  ventas:
    circuits:
      - venta

  compras:
    circuits:
      - compras

  administrador:
    circuits:
      - venta
      - compras
      - despacho_fifo
      - percepciones_iibb
      - importacion_articulos
      - integracion_ecommerce
      - envio_comprobantes
