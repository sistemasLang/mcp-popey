  usuario:
    description: "Usuarios del sistema: maestro de usuario, su estado (habilitado/baja), sus roles (incluye cómo se identifica a un vendedor) y a quién apuntan el nusuariocreador/nusuarioactualiza de los comprobantes. Documenta la cadena id_usuario -> nombre."
    docs:
      - Popey-ERP/docs/MODULO_USUARIO.md
    naming_note: >
      El schema `seguridad` es consultable desde el MCP a propósito, para
      resolver id de usuario -> nombre/rol (por ejemplo, el vendedor de un
      comprobante). Solo se exponen las key_columns de abajo: password, hash
      de recuperación, códigos 2FA, estado de bloqueo y fecha de nacimiento
      están excluidos acá y, además, el rol de BD mcp_popey_ro solo tiene
      SELECT por columna sobre estas mismas columnas
      (scripts/create_readonly_role.sql). Por eso un SELECT * sobre estas
      tablas devuelve "permission denied": hay que nombrar las columnas.
      Corrección de un error frecuente: seguridad.usuario NO tiene FK a
      public.persona; el nombre vive directo en usuario.vnombre/vapellido.
      nusuariocreador es seguridad.usuario.nusuario, NO public.persona.npersona.
    tables:
      - table: seguridad.usuario
        role: "Maestro de usuarios. PK nusuario. El nombre vive DIRECTO acá (vnombre, vapellido) — no hay FK a persona. nusuariocreador acá es autorreferencia (qué usuario lo creó)."
        key_columns: [nusuario, vnombre, vapellido, vusuario, vemail, bhabilitado, tshabilitado, nusuariocreador, tscreado, tsactualizado]
        source: "introspección de la base viva (pg_catalog) — 2026-10-18"
        notes: "Excluidas a propósito: credenciales (vpassword, vhashrecupclave, tsexpiracionhash, tsultimaactpassword), 2FA (vcodigo2fa, bcodigo2favalidado, bautenticacion2fa y sus timestamps), estado de bloqueo (bbloqueoauto, tsbloqueoauto), dato personal (dfechanacimiento) y jnavegabilidad."
      - table: seguridad.usuarioxrol
        role: "Asignación N:M usuario↔rol, con alcance por depósito. Una fila por (nusuario, nrol, ndeposito): un mismo rol se repite una vez por depósito asignado. 'Es vendedor' = existe al menos una fila con nrol = 4."
        key_columns: [nusuarioxrol, nusuario, nrol, ndeposito]
        source: "introspección de la base viva (FKs: usuarioxrol_usuario, usuarioxrol_rol, usuarioxrol_ndeposito_fkey) — 2026-10-01"
      - table: seguridad.rol
        role: "Catálogo de roles. nrol -> vrol: 1 ADMINISTRADOR, 2 GERENTE, 3 ENCARGADO, 4 VENDEDOR, 5 CONTADOR, 6 SOPORTE, 7 SERVICIO TECNICO, 8 DISTRIBUIDOR, 9 CONSULTOR, 10 FULL, 11 CAJERO, 12 DESPACHO."
        key_columns: [nrol, vrol]
        source: "introspección de la base viva (seguridad.rol) — 2026-10-01"
      - table: seguridad.view_usuario
        role: "Vista COMPLETA de usuario que usa la app: expone vfullname ('Apellido, Nombre') y flags brol* por rol, pero TAMBIÉN vpassword: el MCP solo expone (y el rol de BD solo tiene grant sobre) las columnas de abajo. Es la forma más directa de resolver id -> nombre ('Apellido, Nombre')."
        key_columns: [nusuario, vnombre, vapellido, vfullname, vusuario, vemail, bhabilitado, vhabilitado, vrol, nroles, broladmin, brolgerente, brolencargado, brolvendedor, brolcontador, brolsoporte, brolserviciotecnico, broldistribuidor, brolconsultor, brolfull, brolcajero, broldespacho]
        source: "pg_get_viewdef('seguridad.view_usuario') — 2026-10-01; columnas confirmadas por introspección de la base viva (pg_catalog) — 2026-10-18"
        notes: "Excluidas a propósito: vpassword, bbloqueoauto, bautenticacion2fa y dfechanacimiento."

  posventa:
    description: "circuito de Posventa, el espejo hacia atrás de la venta: Nota de Posventa (intención: qué renglones de Remito de venta vuelven, cuánto y por qué motivo), Nota de Reingreso (hecho físico: entrada de stock al depósito, con imputación a la Nota de Pedido de lo remitido y no facturado) y Nota de Crédito generada desde la Posventa (efecto financiero/AFIP, sin stock); incluye estados, comentarios, cliente de contacto y permiso de acceso"
    docs:
      - Popey-ERP/docs/POSVENTA_REINGRESO_NOTA_CREDITO.md
    naming_note: >
      POSVENTA_REINGRESO_NOTA_CREDITO.md es la referencia vigente;
      CIRCUITO_POSVENTA.md es la bitácora histórica (renames devolución →
      posventa y Nota de Devolución → Nota de Reingreso) y no se toma como
      fuente de columnas. DDL base en db/deployed/009_v1.8.0.sql (bloques
      "Circuito de Posventa" y "Nota de Reingreso"); nclientecontacto y
      ctipocomprobantenotacredito se agregan en db/deployed/009_v1.8.1.sql y
      venta.relacion_notareingreso_notapedidoitem en db/deployed/010_v1.8.1.sql.
      Enganches: la Posventa parte del renglón de Remito de venta
      (articulos_posventa.nitemremito → stock.remitoxitem.nitem); Reingreso y
      NC se enganchan al ítem de Posventa por narticuloposventa (en la NC,
      stock.notacreditoxitem.narticuloposventa, nullable). Ningún saldo tiene
      contador físico salvo nota_pedido_item.ncantidadreingresada: disponible,
      pendiente de reingresar y acreditado se calculan con SUM() (doc §5).
      El estado de la Posventa solo lo mueve el Reingreso; emitir la NC no lo
      cambia. Datos personales del cliente (nombre, CUIT/DNI, email,
      teléfono) y tsv_busqueda se excluyen a propósito de key_columns; el
      cliente se resuelve por ncliente / nclientecontacto. Las tablas de NC
      (stock.nota_credito y satélites) están en el circuito venta.
    tables:
      # --- Nota de Posventa ---
      - table: venta.nota_posventa
        role: "Cabecera de la Nota de Posventa (NPV…): la intención de devolución/cambio sobre uno o más Remitos de venta. No mueve stock ni tiene efecto financiero. nsucursal = depósito de la sesión al crearla; nremitos = PKs de los Remitos de la nota (jsonb denormalizado)"
        key_columns: [nnotaposventa, ncliente, nrazonsocial, nusuariocreador, nsucursal, tscreado, tnota, vnumero, nestadoposventa, nremitos, tremitosnumero, nclientecontacto]
        notes: "Excluidas a propósito: vcliente, vcui, ncui (snapshot del cliente copiado del primer Remito) y tsv_busqueda. nclientecontacto (→ public.entidadcp) es la persona con la que se habla por la posventa, sin relación con ncliente. Filtrar por Remito con nremitos (jsonb, índice GIN)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.2; nclientecontacto en db/deployed/009_v1.8.1.sql línea 41"
      - table: venta.estado_posventa
        role: "Catálogo de estado de la Posventa: 1 Abierta, 2 Procesando, 3 Cerrado, 4 Cancelado (App\\Constant\\EstadoPosventa). Abierta → Procesando por Reingreso parcial o por comentario; Cerrado cuando a ningún ítem le queda acción; Cancelado solo sin comprobantes"
        key_columns: [nestadoposventa, vestadoposventa, bhabilitado]
        source: "introspección de la base viva (venta.estado_posventa) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.1 y §4.1"
      - table: venta.articulos_posventa
        role: "Ítems de la Posventa: renglón de Remito que vuelve, cantidad y motivo. narticuloposventa es la clave que usan Reingreso y NC. Un mismo nitemremito puede repetirse en varias líneas (ej.: 2 Devolución + 1 Cambio); el combo va entero en una línea"
        key_columns: [narticuloposventa, nnotaposventa, nitemremito, ncantidad, nmotivo]
        notes: "Disponible para Posventa por renglón de Remito = remitoxitem.ncantidad − Σ articulos_posventa.ncantidad de notas no canceladas (doc §5.1)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.3"
      - table: stock.motivo_nota_credito_venta
        role: "Catálogo de motivos reutilizado por la Posventa (articulos_posventa.nmotivo): Servicio Técnico, Otros, Devolución, Error de Facturación, Cambio, Garantía"
        key_columns: [nmotivonotacreditoventa, vmotivonotacreditoventa, bhabilitado]
        source: "introspección de la base viva (stock.motivo_nota_credito_venta) — 2026-11-02"
      - table: venta.nota_posventa_comentario
        role: "Comentarios de seguimiento de la Posventa, con foto del estado de la nota al comentar. Comentar una nota Abierta la pasa a Procesando"
        key_columns: [nnotaposventacomentario, nnotaposventa, nusuariocreador, tscreado, tcomentario, nestadoposventa]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.4"
      - table: venta.view_nota_posventa
        role: "Listado y consulta de Notas de Posventa: cabecera + estado, sucursal, empresa, usuario creador con nombre resuelto y agregados de ítems"
        key_columns: [nnotaposventa, vnumero, ncliente, nrazonsocial, vempresa, nusuariocreador, vusuariocreador, tscreado, dfecha, dfullfecha, dfullcreadahora, tnota, nestadoposventa, vestadoposventa, nremitos, tremitosnumero, nitems, ncantidadtotal, nsucursal, vsucursal, nclientecontacto]
        notes: "Excluidas a propósito: vrazonsocial, vcliente, vcui, ncui, vemail, vtelefono, vclientecontacto (datos del cliente) y tsv_busqueda."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.8"
      - table: venta.view_articulos_posventa
        role: "Ítems de la Posventa con el renglón de Remito de origen: artículo, Remito, motivo, cantidad remitida, marca, serial y tipo de comprobante de la Factura (decide el tipo de NC)"
        key_columns: [narticuloposventa, nnotaposventa, nitemremito, ncantidad, narticulo, varticulo, vcodeart, nremito, vnumeroremito, nmotivo, vmotivo, ncantidadremitida, vpartnumber, vmarca, vserialnumber, ctipocomprobantenotacredito]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; ctipocomprobantenotacredito en db/deployed/009_v1.8.1.sql línea 22"
      - table: venta.view_nota_posventa_comentario
        role: "Comentarios con usuario resuelto a nombre y estado de la nota al comentar"
        key_columns: [nnotaposventacomentario, nnotaposventa, nusuariocreador, vusuariocreador, tscreado, dfullcreadahora, tcomentario, nestadoposventa, vestadoposventa]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.view_remito_comprobantes
        role: "Selector de Remitos del alta de Posventa: una fila por Remito con las Facturas y NP asociadas"
        key_columns: [nremito, vnumero, vcomprobante, nentidadcp, dfecha, dfullfecha, fechayhora, ndeposito, vdeposito, nestado, vestadoremito, vtipocomprobante, ctiporemito, nrazonsocial, vempresa, tfacturasasociadas, tnotaspedidoasociadas, jfacturasasociadas, jnotaspedidoasociadas, vtipocomprobanteabr]
        notes: "Excluidas a propósito: ventidadcp, vrazonsocial, vcui, ncui (datos del cliente) y tsv_busqueda."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.8"

      # --- Nota de Reingreso (mueve stock) ---
      - table: venta.nota_reingreso
        role: "Cabecera de la Nota de Reingreso (NR…): el hecho físico de lo que volvió y a qué depósito; siempre contra una Posventa. Genera un movimiento de Entrada Directa (nmovimiento, 1:1). bhabilitado: true Confirmado / false Anulado (anulación no implementada)"
        key_columns: [nnotareingreso, nnotaposventa, nusuariocreador, ndeposito, tscreado, tnota, vnumero, bhabilitado, nmovimiento]
        notes: "ndeposito es donde se recibe y puede diferir de nota_posventa.nsucursal."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.5 y §10"
      - table: venta.nota_reingreso_item
        role: "Ítems del Reingreso: qué ítem de Posventa se efectiviza y cuánto (puede ser parcial), con el ejemplar puntual (serializados) o el componente del combo (nremitoxitemcombo)"
        key_columns: [nnotareingresoitem, nnotareingreso, narticuloposventa, ncantidad, nejemplar, nremitoxitemcombo]
        notes: "Pendiente de reingresar = articulos_posventa.ncantidad − Σ reingresado de Reingresos bhabilitado; en combos, MIN por componente (doc §5.2)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.6"
      - table: venta.view_nota_reingreso
        role: "Listado/detalle de Reingresos: + número de Posventa, usuario y depósito con nombre, estado Confirmado/Anulado y agregados de ítems"
        key_columns: [nnotareingreso, vnumero, nnotaposventa, vnumeroposventa, nusuariocreador, vusuariocreador, tscreado, dfecha, dfullfecha, dfullcreadahora, tnota, bhabilitado, vestadoreingreso, ndeposito, vdeposito, nmovimiento, nitems, ncantidadtotal]
        notes: "Excluida a propósito: vcliente (nombre del cliente de la Posventa)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.view_nota_reingreso_item
        role: "Ítems del Reingreso con artículo del Remito, motivo de la Posventa, serial y artículo del componente del combo"
        key_columns: [nnotareingresoitem, nnotareingreso, narticuloposventa, nitemremito, narticulo, varticulo, vcodeart, ncantidad, nmotivo, vmotivo, nejemplar, vserialnumber, nremitoxitemcombo, narticulocombo, varticulocombo, vcodeartcombo]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.relacion_notareingreso_notapedidoitem
        role: "Imputación del Reingreso a la Nota de Pedido: lo reingresado de un renglón remitido y no facturado deja de estar pendiente de facturar (suma a nota_pedido_item.ncantidadreingresada). Camino: ítem de Posventa → nitemremito → relacion_remitoxitem_notapedidoitem → ítem de NP"
        key_columns: [nrelacionnotareingresonotapedidoitem, nnotareingreso, narticuloposventa, nitemnotapedido, ncantidad]
        notes: "Solo se imputa a ítems de NP con ncantidadfacturada = 0. Si volvió todo y no se facturó nada, la NP queda Cancelado."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/deployed/010_v1.8.1.sql línea 435; POSVENTA_REINGRESO_NOTA_CREDITO.md §10.7"
      - table: venta.nota_pedido_item
        role: "Renglón de NP afectado por la Posventa: ncantidadreingresada (Reingreso de lo no facturado) y ncantidadacreditada (NC de lo facturado y no remitido). Detalle completo en el circuito venta"
        key_columns: [nitem, nnotapedido, narticulo, ncantidad, ncantidadremitida, ncantidadfacturada, ncantidadacreditada, ncantidadreingresada]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; CIRCUITO_NP_REMITO_FACTURA.md (ncantidadacreditada 2026-09-28, ncantidadreingresada change nota-pedido-reingreso-sin-facturar)"
      - table: stock.movimiento_deposito
        role: "Movimiento de Entrada Directa generado por cada Nota de Reingreso (nota_reingreso.nmovimiento); es el que mueve el stock (detalle en importacion_articulos / MODULO_STOCK_ARTICULOS.md)"
        key_columns: [nmovimientodeposito, ndepositoorigen, ndepositodestino, cestadomov, ntipomov, tnota]
        source: "introspección de la base viva (pg_catalog) — 2026-10-18; POSVENTA_REINGRESO_NOTA_CREDITO.md §10.3"
      - table: stock.movimientodepositoxarticulo
        role: "Detalle del movimiento de Entrada Directa del Reingreso: una línea por ejemplar o la cantidad a granel"
        key_columns: [nmovimientodepositoxarticulo, narticulo, nmovimiento, nejemplar, dcantidad]
        source: "db/initial/schema_stock.sql líneas 454-478 (ya relevada en importacion_articulos)"

      # --- Nota de Crédito desde la Posventa ---
      - table: stock.notacreditoxitem
        role: "Ítems de la NC; narticuloposventa (nullable, FK fk_notacreditoxitem_articuloposventa a venta.articulos_posventa) marca que el ítem de Posventa ya tiene NC y es la única fuente de verdad de eso. NULL en NC de la pantalla vieja. nfacturaxitem = renglón de Factura acreditado"
        key_columns: [nnotacreditoxitem, nnotacredito, nfacturaxitem, ncantidad, ftotal, fpreciounitario, ndescuento, vcodigo, vdescripcion, narticuloposventa]
        notes: "Acreditado por renglón de Factura = Σ notacreditoxitem.ncantidad de todas las NC, de cualquier origen (doc §5.3). §2 del doc dice 'sin FK', pero §3.7 y la base viva (pg_constraint, 2026-11-02) confirman que la FK existe."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.7"
      - table: venta.nota_posventa_nota_credito
        role: "Relación N:M cabecera Posventa ↔ Nota de Crédito (incluye la NC libre creada con nnotaposventa). Las NC anteriores al change solo tienen el vínculo por ítem: toda lectura de 'NC de la Posventa' debe unir ambos vínculos"
        key_columns: [nnotaposventa, nnotacredito, nusuariocreador, tscreado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.7.1"
      - table: stock.nota_credito
        role: "Cabecera de la NC emitida desde la Posventa (ctiponotacredito = 'FV'); detalle completo en el circuito venta"
        key_columns: [nnotacredito, nentidadcp, ndeposito, corigen, ctiponotacredito, ncomprobanteorigen, nmotivo, vafip_cae, vnumero]
        source: "ya relevada en el circuito venta (introspección 2026-10-18)"

      # --- Externas del origen (Remito de venta) ---
      - table: stock.remitoxitem
        role: "Renglón de Remito de venta del que parte cada ítem de Posventa (articulos_posventa.nitemremito)"
        key_columns: [nitem, nremito, narticulo, ncantidad, nejemplar, nfactura]
        source: "ya relevada en el circuito venta"
      - table: stock.remitoxitemcombo
        role: "Componente de combo remitido; el Reingreso de un combo se registra por componente (nota_reingreso_item.nremitoxitemcombo)"
        key_columns: [nremitoxitemcombo, nitem, nremito, narticulo, ncantidad, nejemplar]
        source: "ya relevada en el circuito venta"

      # --- Permiso ---
      - table: administracion.permiso_notas_posventa
        role: "Permiso de acceso a la pantalla de Notas de Posventa: la presencia de una fila para el usuario = tiene permiso (viaja en sesión como permisoNotasPosventa)"
        key_columns: [npermisonotasposventa, nusuario, nusuariocreador, tscreado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; POSVENTA_REINGRESO_NOTA_CREDITO.md §3.9 y §13"