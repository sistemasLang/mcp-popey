        source: "introspección de la base viva (pg_catalog) — 2026-10-18 (incluye nsolicitud y ningresosarticulo, ausentes en db/initial/schema_stock.sql)"
      - table: stock.movimientodepositoxarticulo
        role: "Detalle del movimiento: una línea por ejemplar (ntipostock=2) o una única línea con la cantidad total (ntipostock=1, a granel)"
        key_columns: [nmovimientodepositoxarticulo, narticulo, nmovimiento, nejemplar, dcantidad]
        source: "db/initial/schema_stock.sql líneas 454-478"
      - table: stock.ejemplar
        role: "Un registro por unidad para artículos ntipostock=2; vserialnumber se autogenera por trigger si viene NULL"
        key_columns: [nejemplar, narticulo, vserialnumber]
        source: "IMPORTAR_ARTICULOS.md; ver también erd_nota_pedido_remito_factura.dbml"
      - table: compra.articulo_numero_despacho
        role: "Para artículos a granel (ntipostock=1): se registra un lote nuevo con ncantidad=nremanente=cantidad total y vnumerodespacho=NULL (mismo mecanismo que un Ingreso Directo manual; ver circuito despacho_fifo)"
        key_columns: [narticulonumerodespacho, narticulo, ndeposito, ncantidad, nremanente, vnumerodespacho]
        source: "IMPORTAR_ARTICULOS.md; DDL completo ya relevado en el circuito despacho_fifo"
      - table: stock.articuloxdeposito
        role: "Destino final del stock inicial; lo actualiza el trigger trigger_i_a_movimientodepositoxarticulo, nunca se escribe directo desde el importador"
        key_columns: [narticulo, ndeposito, dcantidad]
        source: "IMPORTAR_ARTICULOS.md (remite a MODULO_STOCK_ARTICULOS.md §7)"

  integracion_ecommerce:
    description: "integración del ERP con marketplaces/e-commerce (MercadoLibre, QLoud, TiendaNube) vía el middleware nexus-api: login/refresh de token, alta y vinculación de cuenta de plataforma, sincronización/publicaciones y webhooks entrantes"
    docs:
      - Popey-ERP/docs/ENEXUS_INTEGRACION.md
      - Popey-ERP/docs/TIENDANUBE_INTEGRACION.md
    naming_note: >
      ENEXUS_INTEGRACION.md casi no usa el formato `schema.tabla` en el texto
      (nombra clases ORM: BridgeTable, CredencialesTable, PlataformaIntegradaTable).
      Se resolvió el nombre físico real leyendo el `$this->table(...)` de cada
      *Table.php en Lang-dev/src/Model/Table/ (fuente más directa que cualquier
      .md o .sql para esto, porque CakePHP no requiere migración versionada:
      estas tablas del esquema e_plataforma no aparecen en ningún .sql
      rastreado del repo — se crearon directo en la base o fuera del historial
      versionado disponible). TIENDANUBE_INTEGRACION.md es una guía de alta de
      credenciales de partner, no describe tablas.
    tables:
      - table: e_plataforma.bridge
        role: "Cuenta de conexión del ERP con nexus-api (accessKey/secretKey); getCuenta() siempre trae la primera/única fila"
        key_columns: [nbridge, vnombreusuario, vuserid, bhabilitado, nusuariocreador, tscreado, nusuarioactualiza, tsactualizado]
        notes: "vaccesskey y vsecretkey existen pero se excluyen a propósito: son secretos de la cuenta nexus-api y no deben ser consultables."
        source: "introspección de la base viva (pg_catalog) — 2026-10-18; Lang-dev/src/Model/Table/BridgeTable.php + ENEXUS_INTEGRACION.md §2"
      - table: e_plataforma.credenciales
        role: "Tokens de sesión con nexus-api; ENexusService::login() toma la última por tscreado. Solo se exponen metadatos de expiración"
        key_columns: [ncredencial, nexpiresin, tscreado, tsexpiraciontoken, tsactualizado]
        notes: "vaccesstoken y vrefreshtoken existen pero se excluyen a propósito: son tokens de sesión y no deben ser consultables."
        source: "introspección de la base viva (pg_catalog) — 2026-10-18; Lang-dev/src/Model/Table/CredencialesTable.php + ENEXUS_INTEGRACION.md §4"
      - table: e_plataforma.plataforma_integrada
        role: "Catálogo de plataformas soportadas (MercadoLibre=1/meli, QLoud=2/qloud, TiendaNube=3/tiendanube); nplataforma viaja al backend, vidplataforma lo usa el frontend"
        key_columns: [nplataforma, vidplataforma]
        source: "ENEXUS_INTEGRACION.md §6, confirmado en Lang-dev/src/Model/Table/PlataformaIntegradaTable.php"
      - table: e_plataforma.cuenta_x_plataforma
        role: "Cuenta de plataforma vinculada (una fila por tienda/cuenta conectada); referenciada también en LISTAS_DE_PRECIO.md como origen de la lista de precio con la que vende cada cuenta"
        key_columns: [ncuentaxplataforma, nplataforma, nlistaprecio]
        source: "Lang-dev/src/Model/Table/CuentaPlataformaNexusTable.php ($this->table()); no documentada en detalle en ENEXUS_INTEGRACION.md"
      - table: mercado_libre.meli_relacion_publicacion
        role: "Relación publicación de MercadoLibre ↔ artículo del ERP (el modal de §9 de ENEXUS_INTEGRACION.md es la UI de esta relación para MELI; otras plataformas probablemente tengan tablas análogas no relevadas acá)"
        key_columns: [nmelirelacionpublicacion]
        source: "Lang-dev/src/Model/Table/MeliRelacionPublicacionTable.php"
      - table: mercado_libre.ml_orden
        role: "Orden de MercadoLibre descargada (flujo legacy MELIShell/MercadoLibreService); nfacturaventa vincula la orden con la Factura de Venta que la facturó (la factura no guarda la orden)"
        key_columns: [nmlorden, mlorden_sup, mlorden_inf, tsdatecreated, tslastupdated, tsdateclosed, tbuyingmode, ftotalamount, fpaidamount, tstatus, nbuyerid, vshippingid, tpack_id, nfacturaventa, nusuariofactura, bfacturasubida, tsfechafacturasubida, nusuariosubiofactura, betiquetaimpresa, tsfechaimpresion, nautentificacion]
        notes: "Excluidas a propósito: vbuyernickname/vbuyerfirstname/vbuyerlastname (datos personales del comprador), tordenjson (payload crudo de MELI), vidfacturasubida."
        source: "introspección de la base viva (information_schema) — 2026-10-21; Lang-dev/src/Model/Table/MeliOrdenTable.php"
      - table: ecommerce.elang_venta
        role: "Venta ecommerce descargada (QLoud = nplataforma 2, Prestashop = 1); tformapago es el medio de pago informado por la plataforma y nfacturaventasistema la Factura de Venta que la facturó"
        key_columns: [nelangventa, nventa, ncliente, nplataforma, tsfechafactura, tsfechaactualizacion, nestadoelang, nestadosistema, tformapago, ntotalpagado, ntotalventa, treferencia, ntransporte, ncostotransporte, bfree, nfacturaventasistema, ntransportista, vtracking, bpreparadopaquete, tspreparadopaquete]
        notes: "Excluidas a propósito: tinfocompleta y tinfotransporte (payload crudo con datos personales del cliente), direcciones y numerofactura."
        source: "introspección de la base viva (information_schema) — 2026-10-21; Lang-dev/src/Model/Table/ELangVentaTable.php"

  ordenes_ecommerce:
    description: "órdenes de marketplaces (MercadoLibre, QLoud, TiendaNube) recibidas vía e-nexus: llegada de la notificación y su procesamiento por cron, encabezado/ítems/comprador de la orden, cobertura con Nota de Pedido de origen Ecommerce, reservas y solicitudes a otras sucursales, recolección de artículos en el depósito (agrupando órdenes por cuenta) y armado de cada orden por escaneo; incluye el estado efectivo que muestra el listado de órdenes"
    docs:
      - Popey-ERP/docs/ORDENES_PLATAFORMA.md
    naming_note: >
      Todo el esquema del circuito está en db/inc/010_v1.9.0.sql (migración
      pendiente; los scripts de esta versión se editan en el lugar, sin bloques
      de migración). e_plataforma.notificacion_enexus es anterior: el .sql solo
      le agrega columnas (nestado, vidrecurso, vurlrecurso, tsnotificacion,
      nintentos, tmotivoerror, tsprocesada). Orden del circuito:
      (1) callbackUrl() guarda la notificación pendiente → (2) NexusShell::
      procesarNotificaciones() crea/actualiza la orden, sus ítems y el
      comprador → (3) cobertura: NP de origen Ecommerce, reservas y
      solicitudes → (4) recolección (varias órdenes, ítems sumados por cuenta
      y artículo) → (5) armado por orden contra los renglones de la NP → (6)
      remito/factura de la NP (circuito venta). El estado que ve el usuario NO
      es orden_plataforma.nestadoorden (solo 1, 2, 3 u 8) sino
      view_orden_plataforma.nestadoordenefectivo, derivado con la prioridad
      cancelada (8) > armado total (7) > armado parcial (6) > recolección
      Completa (5) > recolección En proceso (4) > nestadoorden.
      Datos personales del comprador y payloads crudos de la plataforma se
      excluyen a propósito de key_columns (mismo criterio que
      mercado_libre.ml_orden en integracion_ecommerce).
      ATENCIÓN: el rol mcp_popey_ro necesita grant SELECT sobre las tablas
      nuevas de e_plataforma para que estas consultas funcionen.
    tables:
      # --- Paso 1: llegada de la notificación (callbackUrl) ---
      - table: e_plataforma.notificacion_enexus
        role: "Cola de notificaciones de e-nexus: ENexusController::callbackUrl() valida la envoltura y la guarda pendiente; NexusShell::procesarNotificaciones() la toma por lote. nestado: 1 pendiente, 2 procesando, 3 procesada, 4 error, 5 descartada (App\\Constant\\EstadoNotificacionENexus)"
        key_columns: [nnotificacion, nplataforma, vevento, bprocesada, tscreado, tsactualizada, nestado, vidrecurso, vurlrecurso, tsnotificacion, nintentos, tmotivoerror, tsprocesada]
        notes: "Excluida a propósito: jdata (envoltura completa con la orden y los datos personales del comprador). bprocesada se mantiene en sincronía con nestado solo por compatibilidad; usar nestado. vidrecurso es el id de la orden en la plataforma (cruza con orden_plataforma.vidorden)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; ALTER en db/inc/010_v1.9.0.sql líneas 223-242; ORDENES_PLATAFORMA.md §2"

      # --- Paso 2: orden, ítems y comprador ---
      - table: e_plataforma.orden_plataforma
        role: "Encabezado de la orden: una fila por orden de cada cuenta (UNIQUE ncuentaxplataforma + vidorden). La crea/actualiza NexusShell vía OrdenPlataformaService con la orden normalizada de e-nexus. ncliente es el cliente del ERP (encontrado por documento del comprador o el cargado luego en la NP); vidpack agrupa órdenes de un mismo carrito de MELI"
        key_columns: [nordenplataforma, ncuentaxplataforma, nplataforma, vidorden, vidpack, tsorden, vestadoplataforma, ncliente, ntipologistica, ftotal, fpagado, fenvio, ncantidad, nestadoorden, tobservacion, vurlrecurso, tscreado, tsactualizado, tscobertura, bwarning]
        notes: "Excluida a propósito: jorden (data.order completo, con datos del comprador). nestadoorden solo guarda el estado de NP (1, 2, 3) o Cancelada (8): para el estado real usar view_orden_plataforma.nestadoordenefectivo. vestadoplataforma es el status traducido por e-nexus ('pagada', 'cancelada'...). tscobertura = cuándo se ejecutó la cobertura (una sola vez por orden); bwarning = faltantes, ítems sin relación o cambios de la plataforma posteriores a la cobertura. ntipologistica sin FK todavía: el tipo de logística real (fulfillment, cross_docking...) está en view_orden_plataforma.vtipologistica."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 267-318 y 401-403; ORDENES_PLATAFORMA.md §3.2"
      - table: e_plataforma.estado_orden_plataforma
        role: "Catálogo de estados de la orden: 1 Sin nota de pedido, 2 Nota de pedido parcial, 3 Nota de pedido completa, 4 Recolección parcial, 5 Recolección completa, 6 Armado parcial, 7 Armado total, 8 Cancelada (App\\Constant\\EstadoOrdenPlataforma)"
        key_columns: [nestadoorden, vestadoorden, bhabilitado]
        source: "db/inc/010_v1.9.0.sql líneas 247-261 y 405-407"
      - table: e_plataforma.orden_plataforma_item
        role: "Ítems de la orden: uno por publicación + variación. narticulo sale de relation_nexus (null = ítem Sin relación). Contadores de cobertura de 0 a ncantidad: ncantidadnp (en la NP), ncantidadreservada, ncantidadsolicitada (pedida a otra sucursal), ncantidadsinstock"
        key_columns: [nordenplataformaitem, nordenplataforma, vidpublicacion, vidvariacion, vsku, vnombre, ncantidad, fprecio, fpreciolista, vrelacionnexus, narticulo, fcomision, vtipopublicacion, tscreado, tsactualizado, ncantidadnp, ncantidadreservada, ncantidadsolicitada, ncantidadsinstock, nestadoitem]
        notes: "Excluidas a propósito: jitem y jitemplataforma (payload normalizado y crudo del ítem). fprecio = precio unitario cobrado; fpreciolista = precio unitario sin descuento; fcomision = sale_fee de MELI por unidad."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 323-352 y 431-452; ORDENES_PLATAFORMA.md §3.3"
      - table: e_plataforma.estado_orden_plataforma_item
        role: "Catálogo de estado del ítem de la orden: 1 Pendiente, 2 Reservado, 3 En tránsito, 4 Sin stock, 5 Completo, 6 Sin relación, 7 Cancelado (App\\Constant\\EstadoOrdenPlataformaItem)"
        key_columns: [nestadoitem, vestadoitem, bhabilitado]
        source: "db/inc/010_v1.9.0.sql líneas 410-424"
      - table: e_plataforma.orden_plataforma_item_componente
        role: "Componentes congelados de un ítem combo (ntipostock 7): copia de stock.articulo_x_combo al guardar el ítem; no se recalculan si cambia el maestro. Los combos se cubren, recolectan y arman por componente"
        key_columns: [nordenplataformaitemcomponente, nordenplataformaitem, narticulo, ncantidadxunidad, ncantidad, ncantidadreservada, ncantidadsolicitada, ncantidadsinstock, tscreado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 456-477; ORDENES_PLATAFORMA.md §4.6"
      - table: e_plataforma.cliente_orden_plataforma
        role: "Comprador de la orden (1:1 con orden_plataforma), con los datos de facturación tal como los manda la plataforma; con vtipodocumento + documento se busca el cliente del ERP"
        key_columns: [nclienteordenplataforma, nordenplataforma, vtipodocumento, vtipocliente, vciudad, vprovincia, vcodigopostal, vpais, tscreado, tsactualizado]
        notes: "Excluidas a propósito por ser datos personales: vnombre, vapellido, vdocumento, vcalle, vnumero, vpiso, vdepto, vtelefono, vemail y jdatos. Para el cliente del ERP usar orden_plataforma.ncliente."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 357-385; ORDENES_PLATAFORMA.md §3.4"
      - table: e_plataforma.orden_plataforma_historial
        role: "Bitácora de la orden: cobertura, NP generada/completada, cambios de la plataforma después de la cobertura, recálculos con cambio de estado y cancelación. nusuario null = proceso automático (NexusShell)"
        key_columns: [nordenplataformahistorial, nordenplataforma, tsevento, vevento, tdetalle, nusuario]
        notes: "Excluida a propósito: jdatos (snapshot crudo del evento)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 564-578"

      # --- Paso 3: cobertura (NP de Ecommerce, reservas y solicitudes) ---
      - table: e_plataforma.orden_plataforma_x_nota_pedido
        role: "Orden ↔ Nota de Pedido. Hoy una NP por orden (la PK compuesta deja abierta más de una); la NP vigente es la no cancelada más reciente"
        key_columns: [nordenplataforma, nnotapedido, tscreado]
        source: "db/inc/010_v1.9.0.sql líneas 480-490; ORDENES_PLATAFORMA.md §4.1"
      - table: e_plataforma.orden_item_x_nota_pedido_item
        role: "Ítem de orden ↔ renglón de NP con las unidades que aporta; dos ítems de orden del mismo artículo apuntan al mismo renglón. Se borra en cascada con el renglón (editar la NP lo reconstruye)"
        key_columns: [nordenitemxnotapedidoitem, nordenplataformaitem, nitem, ncantidad, tscreado]
        source: "db/inc/010_v1.9.0.sql líneas 494-507 y 582-593"
      - table: e_plataforma.orden_item_x_reserva
        role: "Ítem de orden ↔ fila de reserva (la de la NP en la sucursal principal o la reserva de la orden en las demás), con el depósito donde quedó reservado"
        key_columns: [nordenitemxreserva, nordenplataformaitem, narticuloxreservaarticulo, nreservaarticulo, ndeposito, ncantidad, tscreado]
        source: "db/inc/010_v1.9.0.sql líneas 511-529; ORDENES_PLATAFORMA.md §4.1"
      - table: e_plataforma.orden_item_x_solicitud
        role: "Ítem de orden ↔ renglón de solicitud de stock (principal ← sucursal con stock). narticulo es el componente en combos; ncantidadincorporada = unidades ya sumadas a la NP al recibir la solicitud"
        key_columns: [nordenitemxsolicitud, nordenplataformaitem, nsolicitudxarticulo, nsolicitudarticulo, ndepositoorigen, ndepositodestino, narticulo, ncantidad, ncantidadincorporada, tscreado]
        source: "db/inc/010_v1.9.0.sql líneas 533-560; ORDENES_PLATAFORMA.md §4.4"
      - table: venta.nota_pedido
        role: "NP generada por la cobertura de la orden: bordenplataforma = true, norigennotapedido = 4 (Ecommerce), con plataforma y cuenta; treferencia = '<nombre> <apellido> - <documento>' del comprador. Detalle completo en el circuito venta"
        key_columns: [nnotapedido, vnumero, ncliente, ndeposito, nlistaprecio, nestadonotapedido, nestadonotapedidoremito, nestadonotapedidofactura, ftotal, nfacturaventa, bordenplataforma, tobservacionorden, norigennotapedido, nplataforma, ncuentaxplataforma, tscreada]
        notes: "tobservacionorden = aviso de la orden para quien trabaja la NP (cambios posteriores de la plataforma). treferencia no se expone porque contiene el nombre y documento del comprador."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; ALTER en db/inc/010_v1.9.0.sql líneas 396-397, 615 y 633-634"
      - table: venta.origen_nota_pedido
        role: "Catálogo del origen de la NP: 1 Venta (default), 2 Corporativo, 3 Nota de servicio técnico, 4 Ecommerce (App\\Constant\\OrigenNotaPedido)"
        key_columns: [norigennotapedido, vorigennotapedido, bhabilitado]
        source: "db/inc/010_v1.9.0.sql líneas 600-612; ORDENES_PLATAFORMA.md §4.8"
      - table: venta.nota_pedido_item
        role: "Renglones de la NP de la orden; son lo que se arma (artículos simples) y lo que se remite/factura. Detalle completo en el circuito venta"
        key_columns: [nitem, nnotapedido, narticulo, ncantidad, nejemplar, ncantidadremitida, ncantidadfacturada]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.nota_pedido_item_combo
        role: "Componentes de combo de un renglón de NP; en el armado se arma cada componente, no el combo"
        key_columns: [nitemcombo, nitem, nnotapedido, narticulo, ncantidad, nejemplar]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.reserva_articulo
        role: "Reserva de la orden en sucursales distintas de la principal (la de la principal es la de la NP); se libera al preparar la solicitud o al cancelarse la orden. Detalle en el circuito venta"
        key_columns: [nreservaarticulo, dfecha, nsucursal, tsfechaexpiracion, norigen, bhabilitado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: venta.articuloxreserva_articulo
        role: "Filas de reserva por artículo referenciadas desde orden_item_x_reserva.narticuloxreservaarticulo"
        key_columns: [narticuloxreservaarticulo, nreservaarticulo, narticulo, nejemplar, ncantidad, nsucursal, bhabilitado, nitem]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: stock.solicitud
        role: "Solicitud de stock que la cobertura genera hacia la sucursal con stock; al recibirla se completa la NP y al cancelarse la orden se cancelan las pendientes"
        key_columns: [nsolicitudarticulo, ndepositoorigen, ndepositodestino, dfecha, nestadosolicitud, tscreado, benviomercaderia, bprioridad]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; ORDENES_PLATAFORMA.md §4.4-§4.5"
      - table: stock.solicitudxarticulo
        role: "Renglones de la solicitud referenciados desde orden_item_x_solicitud.nsolicitudxarticulo"
        key_columns: [nsolicitudxarticulo, nsolicitud, narticulo, dcantidad, ncantidadconfirmada, tscreado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: stock.estado_solicitud
        role: "Catálogo de estado de la solicitud (1 Pendiente, 2 Procesando, 3 Preparada, 4 Despachada, 5 Recibida, 6 Confirmada, 7 Cancelada, 8 Rechazada...)"
        key_columns: [nestadosolicitud, vestadosolicitud]
        source: "introspección de la base viva (stock.estado_solicitud) — 2026-11-02"

      # --- Paso 4: recolección ---
      - table: e_plataforma.recoleccion
        role: "Encabezado de la recolección: agrupa varias órdenes en una lista de artículos a juntar en el depósito. videntificador visible (R1, R2...); ncantidadarticulos = total de unidades a recolectar"
        key_columns: [nrecoleccion, videntificador, nusuariocreador, nusuarioresponsable, nestadorecoleccion, tsfecha, ncantidadarticulos, tsactualizado]
        notes: "La cancelación es borrado físico (encabezado, ítems y vínculo con las órdenes), en cualquier estado salvo que alguna orden esté armada. Para nombre del creador/responsable usar view_recoleccion."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 778-800; ORDENES_PLATAFORMA.md §6"
      - table: e_plataforma.estado_recoleccion
        role: "Catálogo de estado de la recolección: 1 Pendiente, 2 En proceso, 3 Completa, 4 Cancelada (App\\Constant\\EstadoRecoleccion)"
        key_columns: [nestadorecoleccion, vestadorecoleccion, bhabilitado]
        source: "db/inc/010_v1.9.0.sql líneas 765-776"
      - table: e_plataforma.recoleccion_orden
        role: "Órdenes de la recolección; la orden es la PK: una orden está en a lo sumo una recolección. Quitar la última orden elimina la recolección"
        key_columns: [nordenplataforma, nrecoleccion, tscreado]
        source: "db/inc/010_v1.9.0.sql líneas 836-845; ORDENES_PLATAFORMA.md §6.5d"
      - table: e_plataforma.recoleccion_item
        role: "Detalle a recolectar: una fila por cuenta y artículo (UNIQUE nrecoleccion + ncuentaxplataforma + narticulo). El mismo artículo de distintas órdenes de una cuenta se suma; entre cuentas no. No se vincula con la orden"
        key_columns: [nrecoleccionxarticulo, nrecoleccion, ncuentaxplataforma, narticulo, ncantidad, nestado, tnota]
        notes: "nestado queda null: el catálogo estado_recoleccion_item todavía no tiene estados."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 809-831"
      - table: e_plataforma.estado_recoleccion_item
        role: "Catálogo de estado del ítem de recolección; hoy vacío"
        key_columns: [nestadorecoleccionitem, vestadorecoleccionitem, bhabilitado]
        source: "db/inc/010_v1.9.0.sql líneas 803-807"
      - table: e_plataforma.recoleccion_items_detallada
        role: "Lo recolectado de cada ítem: quién, cuándo y cuánto (escaneo o carga manual). Lo recolectado del ítem es la suma de ncantidad"
        key_columns: [nrecoleccionitemsdetallada, nrecoleccionxarticulo, nusuario, tscreado, ncantidad]
        source: "db/inc/010_v1.9.0.sql líneas 847-861; ORDENES_PLATAFORMA.md §6.4c y §6.4e"
      - table: e_plataforma.view_recoleccion
        role: "Listado de recolecciones: una fila por recolección con estado, creador/responsable con nombre resuelto y total recolectado"
        key_columns: [nrecoleccion, videntificador, tsfecha, nusuariocreador, vcreador, nusuarioresponsable, vresponsable, nestadorecoleccion, vestadorecoleccion, ncantidadarticulos, ncantidadrecolectada]
        notes: "vcreador/vresponsable resuelven el nombre del usuario (la vista lo lee de seguridad.usuario con los permisos de su dueño)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 869-892"
      - table: e_plataforma.view_recoleccion_item
        role: "Ítems de las recolecciones (cuenta y artículo) con plataforma, datos del artículo y cantidad ya recolectada"
        key_columns: [nrecoleccion, nrecoleccionxarticulo, ncuentaxplataforma, vcuenta, nplataforma, vidplataforma, vplataforma, narticulo, varticulo, vmarca, veanupc, vsku, ncantidad, ncantidadrecolectada, nestado, vestado, tnota]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 898-926"

      # --- Paso 5: armado ---
      - table: e_plataforma.armado_items_detallada
        role: "Armado por escaneo: una fila por unidad armada (quién, cuándo, qué renglón de NP o componente de combo, con ejemplar si se escaneó N° de serie). Lo armado sale de sumar este detalle; deshacer borra la última fila. Se borra en cascada si se edita la NP"
        key_columns: [narmadoitemdetallada, nordenplataforma, nitem, nitemcombo, narticulo, nejemplar, nusuario, tscreado, ncantidad]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 928-958 (change armado-orden-por-escaneo de front-nexus)"
      - table: e_plataforma.view_armado_orden_item
        role: "Unidades a armar de cada orden: un renglón por artículo simple o por componente de combo de la NP vigente, sin servicios ni genéricos (ntipostock 4 y 5). bejemplar = requiere ejemplar (ntipostock 2 o 3)"
        key_columns: [nordenplataforma, nnotapedido, nitem, nitemcombo, narticulo, narticulocombo, bejemplar, ncantidad, ncantidadarmada, ncantidadremitida, ncantidadfacturada, nejemplar]
        notes: "Una orden con ncantidadarmada > 0 se considera armada: bloquea cancelar su recolección o quitarla de ella. Deshacer el armado no se permite si el renglón ya tiene remito o factura."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 960-1017"

      # --- Listado de órdenes (estado efectivo) ---
      - table: e_plataforma.view_orden_plataforma
        role: "Listado de órdenes (/api/ordenPlataforma/listadoOrdenes): una fila por orden con cuenta, plataforma, NP vigente, tipo de logística, fecha de entrega, recolección, unidades a armar/armadas y estado efectivo"
        key_columns: [nordenplataforma, ncuentaxplataforma, vcuenta, nplataforma, vplataforma, vidplataforma, vidorden, vidpack, nnotapedido, vnumeronotapedido, vtipologistica, tsorden, ftotal, ncantidad, dentrega, nestadoorden, vestadoorden, vestadoplataforma, bwarning, ncliente, nestadoordenefectivo, vestadoordenefectivo, videntificadorrecoleccion, ncantidadarmar, ncantidadarmada]
        notes: "Excluida a propósito: vcomprador (nombre del comprador). Usar nestadoordenefectivo para filtrar por estado. vtipologistica = 'fulfillment' son órdenes Full: solo visualización, sin cobertura ni acciones (ORDENES_PLATAFORMA.md §4.10)."
        source: "introspección de la base viva (pg_catalog) — 2026-11-02; db/inc/010_v1.9.0.sql líneas 1019-1101; ORDENES_PLATAFORMA.md §5"

      # --- Externas (cuenta y plataforma) ---
      - table: e_plataforma.cuenta_x_plataforma
        role: "Cuenta de plataforma de la orden y de cada ítem de recolección (detalle en integracion_ecommerce)"
        key_columns: [ncuentaxplataforma, nplataforma, vcuenta, nrazonsocial, nlistaprecio, bhabilitado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"
      - table: e_plataforma.plataforma_integrada
        role: "Catálogo de plataformas (1 MercadoLibre, 2 QLoud, 3 TiendaNube)"
        key_columns: [nplataforma, vnombre, vidplataforma, bhabilitado]
        source: "introspección de la base viva (pg_catalog) — 2026-11-02"

