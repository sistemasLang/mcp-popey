        source: "db/initial/schema_stock.sql líneas 454-478"
      - table: stock.ejemplar
        role: "Un registro por unidad para artículos ntipostock=2; vserialnumber se autogenera por trigger si viene NULL"
        key_columns: [nejemplar, narticulo, vserialnumber]
        source: "IMPORTAR_ARTICULOS.md; ver también erd_nota_pedido_remito_factura.dbml"
      - table: compra.articulo_numero_despacho
        role: "Para artículos a granel (ntipostock=1): se registra un lote nuevo con ncantidad=nremanente=cantidad total y vnumerodespacho=NULL (mismo mecanismo que un Ingreso Directo manual; ver circuito despacho_fifo)"
        key_columns: [narticulonumerodespacho, narticulo, ndeposito, ncantidad, nremanente, vnumerodespacho]
        source: "IMPORTAR_ARTICULOS.md; DDL completo ya relevado en el circuito despacho_fifo"
      - table: stock.articuloxdeposito
        role: "Destino final del stock inicial; lo actualiza el trigger trigger_i_a_movimientodepositoxarticulo, nunca se escribe directo desde el importador"
        key_columns: [narticulo, ndeposito, dcantidad]
        source: "IMPORTAR_ARTICULOS.md (remite a MODULO_STOCK_ARTICULOS.md §7)"

  integracion_ecommerce:
    description: "integración del ERP con marketplaces/e-commerce (MercadoLibre, QLoud, TiendaNube) vía el middleware nexus-api: login/refresh de token, alta y vinculación de cuenta de plataforma, sincronización/publicaciones y webhooks entrantes"
    docs:
      - Popey-ERP/docs/ENEXUS_INTEGRACION.md
      - Popey-ERP/docs/TIENDANUBE_INTEGRACION.md
    naming_note: >
      ENEXUS_INTEGRACION.md casi no usa el formato `schema.tabla` en el texto
      (nombra clases ORM: BridgeTable, CredencialesTable, PlataformaIntegradaTable).
      Se resolvió el nombre físico real leyendo el `$this->table(...)` de cada
      *Table.php en Lang-dev/src/Model/Table/ (fuente más directa que cualquier
      .md o .sql para esto, porque CakePHP no requiere migración versionada:
      estas tablas del esquema e_plataforma no aparecen en ningún .sql
      rastreado del repo — se crearon directo en la base o fuera del historial
      versionado disponible). TIENDANUBE_INTEGRACION.md es una guía de alta de
      credenciales de partner, no describe tablas.
    tables:
      - table: e_plataforma.bridge
        role: "Cuenta de conexión del ERP con nexus-api (accessKey/secretKey); getCuenta() siempre trae la primera/única fila"
        key_columns: [nbridge, "accessKey/secretKey (nombres exactos no confirmados)", nusuariocreador, nusuarioactualiza]
        source: "Lang-dev/src/Model/Table/BridgeTable.php ($this->table()) + ENEXUS_INTEGRACION.md §2; DDL no localizado en el repo"
      - table: e_plataforma.credenciales
        role: "Tokens de sesión con nexus-api (accessToken/refreshToken/expiración); ENexusService::login() toma la última por tscreado"
        key_columns: [ncredencial, tscreado, "accessToken/refreshToken/expiración (nombres exactos no confirmados)"]
        source: "Lang-dev/src/Model/Table/CredencialesTable.php + ENEXUS_INTEGRACION.md §4; DDL no localizado en el repo"
      - table: e_plataforma.plataforma_integrada
        role: "Catálogo de plataformas soportadas (MercadoLibre=1/meli, QLoud=2/qloud, TiendaNube=3/tiendanube); nplataforma viaja al backend, vidplataforma lo usa el frontend"
        key_columns: [nplataforma, vidplataforma]
        source: "ENEXUS_INTEGRACION.md §6, confirmado en Lang-dev/src/Model/Table/PlataformaIntegradaTable.php"
      - table: e_plataforma.cuenta_x_plataforma
        role: "Cuenta de plataforma vinculada (una fila por tienda/cuenta conectada); referenciada también en LISTAS_DE_PRECIO.md como origen de la lista de precio con la que vende cada cuenta"
        key_columns: [ncuentaxplataforma, nplataforma, nlistaprecio]
        source: "Lang-dev/src/Model/Table/CuentaPlataformaNexusTable.php ($this->table()); no documentada en detalle en ENEXUS_INTEGRACION.md"
      - table: mercado_libre.meli_relacion_publicacion
        role: "Relación publicación de MercadoLibre ↔ artículo del ERP (el modal de §9 de ENEXUS_INTEGRACION.md es la UI de esta relación para MELI; otras plataformas probablemente tengan tablas análogas no relevadas acá)"
        key_columns: [nmelirelacionpublicacion]
        source: "Lang-dev/src/Model/Table/MeliRelacionPublicacionTable.php"

  envio_comprobantes:
    description: "envío de comprobantes (Presupuesto, Factura de Venta, Remito de Venta, Nota de Crédito de Venta, Tarea de Servicio Técnico) por email desde un único endpoint, resolviendo el remitente configurable por razón social y documento"
    docs:
      - Popey-ERP/docs/ENVIO_COMPROBANTES_EMAIL.md
      - Popey-ERP/docs/CONTACTO_EMPRESA_CORREOS.md
    naming_note: >
      Ambos .md son complementarios (uno documenta el envío, el otro la
      pantalla de configuración del remitente) y coinciden en las tablas;
      sin conflicto de versión.
    tables:
      - table: administracion.documentos_sistema
        role: "Catálogo de documentos del sistema habilitados para impresión/email, con la tabla y columna identificadora de origen (vtable/videntificadortabla)"
        key_columns: [ndocumentosistema, vtipodocumento, vdocumento, ctipocomprobante, bhabilitado, bemailimpresion, vtable, videntificadortabla]
        source: "db/deployed/007_v1.6.0.sql líneas 88-98, consistente con CONTACTO_EMPRESA_CORREOS.md y ENVIO_COMPROBANTES_EMAIL.md"
      - table: administracion.email_rz_documento
        role: "Email configurado por razón social + documento (uno por combinación, UNIQUE); vemail es el campo canónico, fallback al email de la razón social si no hay fila"
