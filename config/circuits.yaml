      - Popey-ERP/docs/ENVIO_COMPROBANTES_EMAIL.md
      - Popey-ERP/docs/CONTACTO_EMPRESA_CORREOS.md
    naming_note: >
      Ambos .md son complementarios (uno documenta el envío, el otro la
      pantalla de configuración del remitente) y coinciden en las tablas;
      sin conflicto de versión.
    tables:
      - table: administracion.documentos_sistema
        role: "Catálogo de documentos del sistema habilitados para impresión/email, con la tabla y columna identificadora de origen (vtable/videntificadortabla)"
        key_columns: [ndocumentosistema, vtipodocumento, vdocumento, ctipocomprobante, bhabilitado, bemailimpresion, vtable, videntificadortabla]
