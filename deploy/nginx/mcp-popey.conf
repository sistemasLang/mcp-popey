# nginx site for mcp-popey (see docs/INSTALACION-VPS.txt, section 8).
# Replace <DOMINIO>, copy to /etc/nginx/sites-available/mcp-popey and run
# `certbot --nginx -d <DOMINIO>` to add HTTPS to this same server block.
#
# Published: /mcp, the OAuth protected resource metadata, /admin/api/ (all
# to the Node process) and the admin panel as static files under /admin/.
# Everything else is 404.
server {
    listen 80;
    server_name <DOMINIO>;

    location = /mcp {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP may answer with SSE: do not buffer.
        proxy_buffering off;
        proxy_cache off;
        # Above QUERY_SQL_TIMEOUT_MS (30 s by default).
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # RFC 9728: MCP clients discover Auth0 from here after a 401. Public, GET only (Node answers 405 otherwise).
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
    }

    # Admin API (OAuth, admin audience). Small JSON bodies only.
    location ^~ /admin/api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    # Admin panel: `ng build` output copied to /opt/mcp-popey/panel/admin/ (index.html, config.json, chunks).
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        root /opt/mcp-popey/panel;
        index index.html;
        # Real files only: unknown paths stay 404 (no SPA catch-all).
        try_files $uri $uri/ =404;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # The panel's only client-side route besides /admin/.
    location = /admin/forbidden {
        root /opt/mcp-popey/panel;
        try_files /admin/index.html =404;
    }
    location = /admin/config.json {
        root /opt/mcp-popey/panel;
        add_header Cache-Control no-store always;
    }

    location / {
        return 404;
    }
}
