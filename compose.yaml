services:
  mcp:
    build: .
    image: mcp-popey:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Must listen on all interfaces inside the container; exposure is limited by `ports`.
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3030
    ports:
      - "127.0.0.1:3030:3030"
    extra_hosts:
      # Lets DB_<KEY>_HOST=host.docker.internal reach a PostgreSQL running on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      # Bind mount (not a named volume) so `docker volume prune` can never delete users.yaml.
      - ./data:/app/data
